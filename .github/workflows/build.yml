name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: gradle

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish gate asks the remote whether this version's tag exists.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # The functional test starts a second Gradle and builds a real mod, which
      # is the only way to find out whether the plugin produces a loadable jar.
      - run: ./gradlew build --no-daemon

      # The linter has two callers and the line above only exercises one of
      # them. This is the other: the library on a jar path, no Gradle involved,
      # the way a mod repository will run it on a release. It exits non-zero
      # when it finds an error, so no `if` is needed to fail the job. The
      # binary is `coderpack`, which is also what writes a new mod project --
      # one tool rather than one per job.
      - name: Lint a packed mod from the command line
        run: |
          ./gradlew :templates:installDist :verify:demoModJar --no-daemon
          ../templates/build/install/coderpack/bin/coderpack verify ../verify/build/demo/demo-mod.jar

      - name: Version and whether it is new
        id: gate
        shell: bash
        run: |
          version=$(grep -E "^version=" gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already published; nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new"
          fi

      # The linter and the scaffolder, as one signed bundle over the Portal
      # API. It lands as a deployment awaiting release, because publishingType
      # in build.gradle.kts is USER_MANAGED: a Central artifact can never be
      # deleted, so the first ones are worth a look before they are permanent.
      - name: Upload the linter and the scaffolder to Maven Central
        if: steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/master'
        run: ./gradlew nmcpPublishAggregationToCentralPortal --no-daemon
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      # The plugin goes somewhere else entirely: `id("dev.ancaria.coderpack")`
      # in a mod build script resolves from the portal and from nowhere else.
      # A plugin id nobody has published before waits for approval there, once.
      - name: Publish the plugin to the Gradle Plugin Portal
        if: steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/master'
        run: ./gradlew :plugin:publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      # Creates the tag, which is what the gate above reads next time.
      - name: Release
        if: steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.version }}
          # The plugin and the linter are Maven artifacts a build resolves. The
          # scaffolder is not: somebody has to be able to download and unzip it
          # before they have a project at all.
          files: templates/build/distributions/coderpack-*.zip
