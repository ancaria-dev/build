// The plugin and the API come from a repository rather than from a checkout
// beside this one, so the project builds wherever it is cloned.
pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

rootProject.name = '{{id}}'
